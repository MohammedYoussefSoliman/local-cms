services:
  postgres:
    image: postgres:16-alpine
    container_name: local-cms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cms}
      POSTGRES_DB: ${POSTGRES_DB:-localization_cms}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-cms} -d ${POSTGRES_DB:-localization_cms}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
